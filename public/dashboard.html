<!-- HTML file for the dashboard page -->
<!DOCTYPE html>

<head>
  
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <a href="#" class="active">Dashboard</a>
    
  </nav>

  <!-- Buttons for dashboard, add contact, login, and account -->
  <div class="big-buttons">
    <button onclick="location.href='dashboard.html'" class="active">Dashboard</button>
    <button onclick="location.href='addcontact.html'">Add Contact</button>
    <button onclick="location.href='login.html'">Logout</button>
    <button onclick="location.href='account.html'">Account Settings</button>
  </div>

  <!-- Toolbar for search box and sorting the contacts -->
  <div class="toolbar">
    <div class="search">
      <label for="search">Search:</label>
      <input type="text" id="search" placeholder="Type to search…">
    </div>
    <p id="contact-count">Contact Count: </p>
    <div class="sort">
      <label for="sort">Sort:</label>
      <select id="sort">
        <option>A–Z</option>
        <option>Z–A</option>
      </select>
    </div>
  </div>

  <!-- Table for showing all of the contacts -->
  <table class="contact-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Contact Type</th>
        
        <th>Actions</th>
        <th>Phone Number</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      
      
    </tbody>
  </table>
  
  <script src="script.js"></script>
</body>
</html>
